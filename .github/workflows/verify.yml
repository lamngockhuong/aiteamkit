name: verify

# Runs tests/verify.sh, the repository's checks. The script exits 0 whatever it finds and marks a
# pass with a line starting with OK, so the job fails on any other line, an error from a check
# included.

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Git identity for the histories the checks build
        run: |
          git config --global user.name verify
          git config --global user.email verify@example.invalid
          git config --global init.defaultBranch main
      - name: Run tests/verify.sh
        run: |
          bash tests/verify.sh > verify-out.txt 2>&1 || true
          cat verify-out.txt
          echo "OK lines: $(grep -c '^OK' verify-out.txt)"
          if grep -v '^OK' verify-out.txt; then
            echo "::error::tests/verify.sh printed lines that do not start with OK (above)"
            exit 1
          fi
