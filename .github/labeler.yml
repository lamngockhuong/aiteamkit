# Labels a pull request from the paths it changes, run by .github/workflows/labeler.yml.
# The label names match the ones on the repository; a label missing there is created grey.
# Type labels (bug, enhancement, documentation) and harness labels are applied by hand. The type
# comes from the Conventional Commit title, which this action cannot read, and a path rule for
# harnesses would fire on every pull request that changes the skill count in all three manifests.

'area: skill':
- changed-files:
  - any-glob-to-any-file: 'plugins/atk/skills/**'

'area: shared':
- changed-files:
  - any-glob-to-any-file: 'plugins/atk/shared/**'

'area: atkx':
- changed-files:
  - any-glob-to-any-file: 'plugins/atkx/**'

'area: hooks':
- changed-files:
  - any-glob-to-any-file: 'plugins/atk/hooks/**'

'area: manifest':
- changed-files:
  - any-glob-to-any-file: ['.claude-plugin/**', '.cursor-plugin/**', '.agents/plugins/**', 'plugins/*/.claude-plugin/**', 'plugins/*/.cursor-plugin/**', 'plugins/*/.codex-plugin/**', 'package.json']

'area: profile':
- changed-files:
  - any-glob-to-any-file: ['plugins/atk/shared/project-profile.md', 'plugins/atk/shared/project-overrides.md']

'area: ci':
- changed-files:
  - any-glob-to-any-file: ['.github/**', 'release-please-config.json']

